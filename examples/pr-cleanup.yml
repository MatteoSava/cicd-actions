# ═══════════════════════════════════════════════════════════════════════════════
# Example: PR Cleanup
# ═══════════════════════════════════════════════════════════════════════════════
# Automatically delete PR images when the PR is closed
# ═══════════════════════════════════════════════════════════════════════════════

name: PR Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # List all your images here
        image:
          - api
          - web
          - worker
    steps:
      - name: Delete PR images
        uses: actions/github-script@v7
        with:
          script: |
            const image = '${{ matrix.image }}';
            const prNumber = context.payload.pull_request.number;
            const prPrefix = `pr-${prNumber}-`;
            const owner = context.repo.owner;
            
            console.log(`🧹 Cleaning up ${image} images for PR #${prNumber}`);
            
            try {
              const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                package_type: 'container',
                package_name: image,
                username: owner,
                per_page: 100
              });
              
              let deleted = 0;
              for (const version of versions.data) {
                const tags = version.metadata?.container?.tags || [];
                const hasPrTag = tags.some(tag => tag.startsWith(prPrefix));
                
                if (hasPrTag) {
                  console.log(`   Deleting: ${tags.join(', ')}`);
                  await github.rest.packages.deletePackageVersionForUser({
                    package_type: 'container',
                    package_name: image,
                    username: owner,
                    package_version_id: version.id
                  });
                  deleted++;
                }
              }
              
              console.log(`✅ Deleted ${deleted} image(s)`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`   No package found for ${image}`);
              } else {
                throw error;
              }
            }
