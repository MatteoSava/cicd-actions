# ═══════════════════════════════════════════════════════════════════════════════
# Example: Scheduled Image Cleanup
# ═══════════════════════════════════════════════════════════════════════════════
# Run weekly to enforce retention policy on container images
# ═══════════════════════════════════════════════════════════════════════════════

name: Image Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log without deleting)'
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # List all your images here
        image:
          - api
          - web
          - worker
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup ${{ matrix.image }}
        uses: MatteoSava/cicd-actions/actions/cleanup-images@main
        with:
          image_name: ${{ matrix.image }}
          owner: ${{ github.repository_owner }}
          owner_type: user  # or 'org' for organizations
          token: ${{ secrets.GITHUB_TOKEN }}
          # Retention policy
          retention_main: '20'      # Keep last 20 main builds
          retention_staging: '10'   # Keep last 10 staging builds
          retention_pr_days: '7'    # Delete PR images after 7 days
          dry_run: ${{ inputs.dry_run || 'false' }}
